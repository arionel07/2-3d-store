services:
  db:
    image: postgres:17-alpine
    container_name: store-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_planner
      POSTGRES_USER: store_planner
      POSTGRES_PASSWORD: store_planner_dev
    ports:
      - "5433:5432"
    volumes:
      - store_planner_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_planner -d store_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  store_planner_db:

